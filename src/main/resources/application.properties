spring.application.name=spring-boot-getting-start
### actuator config
management.endpoints.web.exposure.include=*
management.endpoints.access.default=unrestricted
management.health.livenessstate.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoints.jmx.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
### actuator info endpoint
management.info.java.enabled=true
management.info.os.enabled=true
management.info.env.enabled=true
management.info.process.enabled=true
management.info.git.mode=full
# add custom key-value
info.hello=hello
### profile config
spring.profiles.active=h2
### sql config
spring.sql.init.mode=never
### hikaricp config
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=500
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=1024
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.auto-commit=false
### jpa config
spring.jpa.open-in-view=false
# help to fast app start-up
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.jakarta.persistence.validation.mode=none
### hibernate config
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
# check doc org.hibernate.cfg.JdbcSettings#ALLOW_METADATA_ON_BOOT
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# should be used carefully as pagination will be used in in-memory set to true in production
#spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
#spring.jpa.properties.hibernate.show_sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.highlight_sql=true
### virtual thread config
spring.threads.virtual.enabled=true
### logging config
#logging.level.web=trace
#logging.level.org.springframework.http=trace
#logging.level.sql=trace
#logging.level.com.fasterxml=trace
#logging.level.com.zaxxer=trace
#logging.level.org.springframework.data=trace
### server config - only for debug don't use in production
server.error.whitelabel.enabled=false
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true
server.error.include-binding-errors=always
server.error.include-path=always
### mvc config
#spring.mvc.problemdetails.enabled=true ### uncomment if you want to use spring default ProblemDetailsExceptionHandler
spring.mvc.log-request-details=true
### JPA config
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
### h2 datasource config
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
### h2 console config
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
### hibernate config
# same as spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop ## same as spring.jpa.hibernate.ddl-auto=create-drop already set above
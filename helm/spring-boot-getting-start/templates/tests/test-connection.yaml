apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "spring-boot-getting-start.fullname" . }}-test-connection"
  labels:
    {{- include "spring-boot-getting-start.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ .Values.service.name }}:{{ .Values.service.port }}/actuator/health']
  restartPolicy: Never
